<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{--bg:#f3f5f2;--surface:#fff;--text:#16201b;--muted:#6f7b74;--line:#e5eae6;--accent:#1f7a5c;--in:#1f9d6e;--out:#e0533d;--chip:#eef4f0;--bubble:#1f7a5c;--h1:#17694f;--h2:#2aa57b;--sh:0 1px 2px rgba(20,40,30,.06),0 6px 18px rgba(20,40,30,.06);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1512;--surface:#1a211d;--text:#eaf1ec;--muted:#93a099;--line:#2a332d;--accent:#4fd0a0;--in:#4fd0a0;--out:#ff8a73;--chip:#232d27;--bubble:#2b7a5e;--h1:#12382c;--h2:#1f6b53;--sh:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;max-width:640px;margin:0 auto;position:relative;overflow:hidden}
button,select,input{font-family:inherit}
.in{color:var(--in)}.out{color:var(--out)}
header{padding:14px 16px 6px}
.hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.hd h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.2px}
.hd span{color:var(--muted);font-size:13px;text-transform:capitalize}
.hero{background:linear-gradient(135deg,var(--h1),var(--h2));color:#fff;border-radius:22px;padding:16px 18px 14px;box-shadow:var(--sh)}
.hero .lbl{font-size:12.5px;opacity:.85}
.hero .bal{font-size:30px;font-weight:750;letter-spacing:-.5px;margin:2px 0 12px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .bal.neg{color:#ffd2c9}
.pills{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.16);border-radius:14px;padding:8px 10px;min-width:0}
.pill .dot{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:13px;flex:none}
.pill div{min-width:0}
.pill small{display:block;font-size:11px;opacity:.85}
.pill b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.view{display:none;flex:1;min-height:0;overflow-y:auto;padding:10px 16px 14px}
.view.on{display:block}
#feed.on{display:flex;flex-direction:column;gap:7px}
.day{align-self:center;font-size:11px;color:var(--muted);background:var(--chip);padding:2px 10px;border-radius:999px;margin:10px 0 2px}
.me{align-self:flex-end;background:var(--bubble);color:#fff;padding:8px 13px;border-radius:18px 18px 4px 18px;max-width:80%;word-break:break-word}
.bot{align-self:flex-start;width:min(90%,370px);background:var(--surface);border-radius:18px 18px 18px 4px;padding:11px 12px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:9px}
.btop{display:flex;align-items:center;gap:10px}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex:none;background:var(--chip)}
.ic.out{background:color-mix(in srgb,var(--out) 14%,transparent)}
.ic.in{background:color-mix(in srgb,var(--in) 16%,transparent)}
.mid{flex:1;min-width:0}
.dsc{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mid small{color:var(--muted);font-size:11.5px}
.amt{font-weight:750;font-size:15.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag,select{background:var(--chip);color:var(--text);border:0;border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;max-width:100%}
.gsel{color:var(--accent);font-weight:600}
.del{margin-left:auto;background:none;border:0;color:var(--muted);cursor:pointer;font-size:15px;padding:2px 6px}
.empty{margin:auto;text-align:center;color:var(--muted);padding:24px 8px;max-width:330px}
.empty .big{font-size:44px;line-height:1.1}
.empty b{display:block;color:var(--text);font-size:16px;margin:6px 0 4px}
.empty p{margin:0 0 12px;font-size:13.5px}
.ex{display:inline-block;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:6px 12px;margin:3px;font-size:13px;cursor:pointer;box-shadow:var(--sh)}
form{display:flex;gap:8px;padding:8px 16px}
#inp{flex:1;min-width:0;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:12px 18px;font-size:16px;outline:none;box-shadow:var(--sh)}
#inp:focus{border-color:var(--accent)}
#send{width:46px;height:46px;flex:none;border-radius:50%;border:0;background:var(--accent);color:#fff;cursor:pointer;display:grid;place-items:center}
#send svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tabs{display:flex;background:var(--surface);border-top:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;color:var(--muted);font-size:11.5px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.tabs button.on{color:var(--accent);font-weight:650}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#err{position:absolute;left:16px;right:16px;bottom:128px;background:var(--surface);box-shadow:var(--sh);border-radius:14px;padding:10px 14px;font-size:13px;z-index:5}
#err:empty{display:none}
.card,.hp{background:var(--surface);border-radius:18px;padding:13px 14px;margin-bottom:12px;box-shadow:var(--sh)}
.xp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.xp span{flex:1;font-weight:650;min-width:90px}
.xb{background:var(--chip);color:var(--text);border:0;border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer}
.ht{font-weight:700;margin-bottom:4px;font-size:15px}
.hn{font-size:12.5px;color:var(--muted);margin:4px 0}
.gr{margin:10px 0}
.gr .top{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.gr .top span:last-child{color:var(--muted);font-size:12px;text-align:right}
.bar{height:8px;background:var(--chip);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--out);border-radius:4px}
.gr .bar{margin-top:5px}
.gr .bar i{background:var(--accent)}
.gr.bad .bar i{background:var(--out)}
.tip{font-size:12.5px;margin:6px 0;padding:7px 10px;border-radius:10px;background:var(--chip)}
.tip.bad{background:color-mix(in srgb,var(--out) 12%,transparent)}
.ct{font-size:13px;font-weight:650;margin:14px 2px 6px}
.row{display:grid;grid-template-columns:105px 1fr auto;gap:8px;align-items:center;font-size:12.5px;margin:7px 2px}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin:2px 0 4px}
.lg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
html.kb{padding-bottom:var(--kbd,0px)}
.kb .tabs{display:none}
.kb header{padding:8px 16px 2px}
.kb .hd{margin-bottom:6px}
.kb .hero{padding:8px 14px;border-radius:16px;display:flex;align-items:center;justify-content:space-between}
.kb .hero .pills{display:none}
.kb .hero .bal{font-size:19px;margin:0}
.kb #err{bottom:74px}
.view{overscroll-behavior:contain}
</style>
</head>
<body>
<header>
  <div class="hd"><h1>Catatan Keuangan</h1><span id="mon"></span></div>
  <section class="hero">
    <div class="lbl">Saldo bulan ini</div>
    <div class="bal" id="sBal">Rp0</div>
    <div class="pills">
      <div class="pill"><span class="dot">↓</span><div><small>Pemasukan</small><b id="sIn">Rp0</b></div></div>
      <div class="pill"><span class="dot">↑</span><div><small>Pengeluaran</small><b id="sOut">Rp0</b></div></div>
    </div>
  </section>
</header>
<main>
  <div id="feed" class="view on"></div>
  <div id="vAn" class="view">
    <div id="exp" class="card xp" style="display:none"><span>Ekspor data</span><button class="xb" id="xX" type="button">Excel</button><button class="xb" id="xC" type="button">CSV</button></div>
    <div id="brk"></div>
  </div>
  <div id="vCh" class="view"><div id="chr"></div></div>
</main>
<div id="err"></div>
<form id="f" autocomplete="off">
  <input id="inp" placeholder="mis. nasi goreng 15.000 atau gaji 5jt" enterkeyhint="send">
  <button id="send" aria-label="Kirim"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
</form>
<nav class="tabs">
  <button type="button" class="on" data-t="feed"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.5A8 8 0 1 1 21 12z"/></svg>Catat</button>
  <button type="button" data-t="vAn"><svg viewBox="0 0 24 24"><path d="M12 3v9h9"/><path d="M20.5 15A9 9 0 1 1 9 3.5"/></svg>Analisis</button>
  <button type="button" data-t="vCh"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Grafik</button>
</nav>
<script src="xlsx.full.min.js"></script>
<script>
const EXP={"Makanan & Minuman":["makan","nasi","mie","mi","bakso","kopi","ayam","sate","soto","minum","jajan","snack","warteg","resto","gofood","grabfood","sarapan","teh","roti","es","boba","burger","pizza","martabak","gorengan","lunch","dinner","bubur","gado","ikan","seblak","cilok","kue","susu","galon"],
"Transportasi":["ojek","grab","gojek","bensin","parkir","tol","bus","transjakarta","tije","krl","mrt","lrt","kereta","angkot","taksi","taxi","maxim","pertamax","pertalite","bbm","tiket"],
"Belanja":["belanja","baju","sepatu","shopee","tokopedia","skincare","tas","celana","jaket","lazada","tiktokshop","kosmetik","indomaret","alfamart"],
"Tagihan":["listrik","air","pdam","wifi","internet","pulsa","kuota","kos","kosan","sewa","cicilan","token","bpjs","asuransi","pajak","laundry"],
"Kesehatan":["obat","dokter","vitamin","apotek","gym","klinik","rumah sakit","masker","periksa"],
"Hiburan":["nonton","bioskop","netflix","spotify","game","jalan","wisata","konser","youtube","liburan","karaoke"]};
const INC={"Gaji":["gaji","salary","honor","upah"],"Bonus":["bonus","thr","insentif","komisi"],"Hadiah & Transfer":["dikasih","transfer","hadiah","kado","angpao","terima","cashback","refund","dapat"],"Usaha":["jual","jualan","untung","proyek","freelance","dividen"]};
const OTHER_E="Lainnya",OTHER_I="Pemasukan Lain";
const $=id=>document.getElementById(id);
let items=[],learn={};
const rp=n=>"Rp"+Math.round(n).toLocaleString("id-ID");
try{items=JSON.parse(localStorage.getItem("kj_items")||"[]");learn=JSON.parse(localStorage.getItem("kj_learn")||"{}")}catch(e){}
function save(){try{localStorage.setItem("kj_items",JSON.stringify(items));localStorage.setItem("kj_learn",JSON.stringify(learn))}catch(e){}}

function parseAmount(t){
  const re=/(\d[\d.,]*)\s*(rb|ribu|k|jt|juta)?(?![a-z])/gi;let m,last=null;
  while((m=re.exec(t))!==null)last=m;
  if(!last)return null;
  let raw=last[1].replace(/[.,]+$/,""),suf=(last[2]||"").toLowerCase(),v;
  if(suf){v=parseFloat(raw.replace(/\./g,"").replace(",","."));v*=(suf==="jt"||suf==="juta")?1e6:1e3}
  else if(/^\d{1,3}([.,]\d{3})+$/.test(raw))v=parseFloat(raw.replace(/[.,]/g,""));
  else v=parseFloat(raw.replace(",","."));
  if(!isFinite(v)||v<=0)return null;
  return{value:v,desc:(t.slice(0,last.index)+" "+t.slice(last.index+last[0].length)).replace(/\s+/g," ").replace(/\b(rp|idr)\.?\s*$/i,"").replace(/^\s*[+\-]\s*/,"").trim()};
}
function match(tokens,map){
  for(const c in map)for(const k of map[c])for(const t of tokens)if(t===k||(k.length>=4&&t.startsWith(k)))return c;
  return null;
}
function classify(text,desc){
  const low=desc.toLowerCase(),tokens=low.split(/[^a-z]+/).filter(Boolean);
  const plus=/^\s*\+/.test(text);
  if(learn[low])return learn[low];
  let inc=match(tokens,INCALL);
  if(plus||inc)return{type:"in",cat:inc||OTHER_I};
  return{type:"out",cat:match(tokens,EXPALL)||OTHER_E};
}
function add(text){
  const p=parseAmount(text);
  if(!p)return false;
  const c=classify(text,p.desc);
  const cl=c.type?c:{type:"out",cat:c};
  const lowd=p.desc.toLowerCase();
  let type=cl.type,cat=cl.cat;
  let grp;if(learn[lowd]){type=learn[lowd].type;cat=learn[lowd].cat;grp=learn[lowd].grp}
  items.push({id:Date.now()+Math.random(),text,desc:p.desc||(type==="in"?"Pemasukan":"Pengeluaran"),amount:p.value,type,cat,grp,ts:Date.now()});
  save();return true;
}
function dayKey(ts){return new Date(ts).toDateString()}
function dayLabel(ts){
  const d=new Date(ts),t=new Date();
  if(d.toDateString()===t.toDateString())return"Hari ini";
  const y=new Date();y.setDate(t.getDate()-1);
  if(d.toDateString()===y.toDateString())return"Kemarin";
  return d.toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long"});
}
const MOVE=["kopi","jajan","snack","boba","burger","pizza","martabak","gorengan","cilok","seblak","kue","resto","gofood","grabfood","es","teh"];
EXP["Makanan & Minuman"]=EXP["Makanan & Minuman"].filter(k=>!MOVE.includes(k));
EXP["Tagihan"]=EXP["Tagihan"].filter(k=>k!=="cicilan");
INC.Usaha=INC.Usaha.filter(k=>k!=="dividen");
const EXPALL=Object.assign({"Tabungan & Investasi":["nabung","tabung","tabungan","investasi","reksadana","saham","emas","deposito","bareksa","ajaib","kripto","crypto","darurat","obligasi","sbn"],"Cicilan & Utang":["cicilan","kredit","utang","hutang","pinjol","paylater","spaylater","angsuran","kpr","cc"]},EXP,{"Jajan & Kafe":[...MOVE,"cafe","kafe","starbucks","nongkrong","dessert"]});
const INCALL=Object.assign({"Investasi":["dividen","bunga","return","profit","cuan"]},INC);
const GROUPS={"Kebutuhan":["Makanan & Minuman","Transportasi","Tagihan","Kesehatan"],"Keinginan":["Jajan & Kafe","Belanja","Hiburan","Lainnya"],"Tabungan & Investasi":["Tabungan & Investasi"],"Cicilan & Utang":["Cicilan & Utang"]};
const CATGROUP={};Object.entries(GROUPS).forEach(([g,cs])=>cs.forEach(c=>CATGROUP[c]=g));
const INGROUP={"Gaji":"Aktif","Bonus":"Aktif","Usaha":"Aktif","Hadiah & Transfer":"Pasif & Lainnya","Investasi":"Pasif & Lainnya","Pemasukan Lain":"Pasif & Lainnya"};
const EXPG=Object.keys(GROUPS),INGS=["Aktif","Pasif & Lainnya"];
const TGT={"Kebutuhan":{max:50},"Keinginan":{max:30},"Tabungan & Investasi":{min:20},"Cicilan & Utang":{max:30}};
function grpOf(i){return i.grp||(i.type==="in"?INGROUP[i.cat]:CATGROUP[i.cat])||(i.type==="in"?"Pasif & Lainnya":"Keinginan")}
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function health(brk,mi,tin){
  const g={};EXPG.forEach(k=>g[k]=0);
  mi.filter(i=>i.type==="out").forEach(i=>{const k=grpOf(i);g[k]=(g[k]||0)+i.amount});
  const tout=Object.values(g).reduce((a,b)=>a+b,0);
  const box=el("div","hp");
  box.append(el("div","ht","Kesehatan keuangan bulan ini"));
  if(!tin)box.append(el("div","hn","Catat pemasukan bulan ini supaya persentase terhadap pendapatan bisa dihitung."));
  const tips=[];
  EXPG.forEach(k=>{
    const v=g[k],t=TGT[k],pct=tin?v/tin*100:null;
    const bad=pct!==null&&((t.max&&pct>t.max)||(t.min&&pct<t.min));
    const row=el("div","gr"+(bad?" bad":""));
    const top=el("div","top");
    top.append(el("span",null,(pct===null?"":bad?"⚠️ ":"✅ ")+k),el("span",null,rp(v)+(pct===null?"":" · "+Math.round(pct)+"%")+" · target "+(t.max?"≤"+t.max:"≥"+t.min)+"%"));
    const bar=el("div","bar"),i=el("i");i.style.width=(pct===null?0:Math.min(100,pct))+"%";bar.append(i);
    row.append(top,bar);box.append(row);
    if(bad){
      const p=Math.round(pct);
      if(k==="Kebutuhan")tips.push("Kebutuhan memakan "+p+"% pemasukan. Tinjau lagi tagihan dan biaya makan.");
      if(k==="Keinginan")tips.push("Keinginan "+p+"% dari pemasukan. Coba kurangi jajan, belanja, atau hiburan.");
      if(k==="Tabungan & Investasi")tips.push("Tabungan & investasi baru "+p+"%. Sisihkan di awal bulan, bukan dari sisa.");
      if(k==="Cicilan & Utang")tips.push("Cicilan & utang "+p+"% dari pemasukan. Hindari menambah utang baru.");
    }
  });
  if(tin){
    const sisa=tin-tout;
    box.append(el("div","hn",sisa>=0?"Sisa belum dialokasikan: "+rp(sisa):"Defisit bulan ini: "+rp(-sisa)));
    if(sisa<0)tips.unshift("Pengeluaran melebihi pemasukan sebesar "+rp(-sisa)+".");
    const ag={Aktif:0,"Pasif & Lainnya":0};
    mi.filter(i=>i.type==="in").forEach(i=>{const k=grpOf(i);ag[k]=(ag[k]||0)+i.amount});
    box.append(el("div","hn","Pemasukan aktif "+rp(ag.Aktif)+" · pasif & lainnya "+rp(ag["Pasif & Lainnya"]||0)));
    if(!tips.length)tips.push("Semua rasio masih dalam acuan 50/30/20. Pertahankan.");
    tips.forEach(t=>box.append(el("div","tip"+(tips.length&&t.startsWith("Semua")?"":" bad"),t)));
  }
  box.append(el("div","hn","Acuan umum aturan 50/30/20 (cicilan maks. 30%), bukan nasihat keuangan. Kelompok tiap catatan bisa kamu ubah."));
  brk.append(box,el("div","ct","Pengeluaran per kategori"));
}
const EMO={"Makanan & Minuman":"🍚","Jajan & Kafe":"☕","Transportasi":"🛵","Belanja":"🛍️","Tagihan":"💡","Kesehatan":"💊","Hiburan":"🎬","Tabungan & Investasi":"🐷","Cicilan & Utang":"💳","Lainnya":"🧾","Gaji":"💼","Bonus":"🎁","Hadiah & Transfer":"🤝","Usaha":"🏪","Investasi":"📈","Pemasukan Lain":"💰"};
const GC={"Kebutuhan":"#3b82c4","Keinginan":"#e0a02f","Tabungan & Investasi":"#2e9e6f","Cicilan & Utang":"#c4452d"};
const short=n=>n>=1e6?(n/1e6).toFixed(1).replace(".0","")+"jt":n>=1e3?Math.round(n/1e3)+"rb":String(Math.round(n));
const sg=n=>(n<0?"-":"+")+rp(Math.abs(n));
function chartSvg(cols,mode,id){
  const W=320,H=130,top=8,bot=H-top,L=34,R=316,n=cols.length,sw=(R-L)/n;
  let mx=0;cols.forEach(c=>{const v=mode==="side"?Math.max(...c.segs.map(s=>s.v)):c.segs.reduce((a,s)=>a+s.v,0);if(v>mx)mx=v});
  if(!mx)mx=1;
  const h=v=>v/mx*(bot-top);
  let s='<svg viewBox="0 0 '+W+' '+(H+14)+'" width="100%" role="img">';
  [0,.5,1].forEach(f=>{const y=bot-f*(bot-top);s+='<line x1="'+L+'" x2="'+R+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(L-4)+'" y="'+(y+3)+'" font-size="8" text-anchor="end" fill="var(--muted)">'+short(mx*f)+'</text>'});
  cols.forEach((c,i)=>{
    const x0=L+i*sw;
    if(mode==="side"){const bw=Math.min(14,sw/2.4);c.segs.forEach((g,j)=>{const hh=h(g.v);s+='<rect x="'+(x0+sw/2-bw*c.segs.length/2+j*bw)+'" y="'+(bot-hh)+'" width="'+(bw-1)+'" height="'+hh+'" rx="2" fill="'+g.c+'"/>'})}
    else{const bw=Math.min(22,sw*.7);let y=bot;c.segs.forEach(g=>{const hh=h(g.v);y-=hh;s+='<rect x="'+(x0+(sw-bw)/2)+'" y="'+y+'" width="'+bw+'" height="'+hh+'" fill="'+g.c+'"/>'})}
    if(c.l)s+='<text x="'+(x0+sw/2)+'" y="'+(H+6)+'" font-size="8.5" text-anchor="middle" fill="var(--muted)">'+c.l+'</text>';
    s+='<rect class="hit" data-c="'+id+'" data-i="'+i+'" x="'+x0+'" y="0" width="'+sw+'" height="'+H+'" fill="transparent" style="cursor:pointer"/>';
  });
  return s+'</svg>';
}
function legend(a){return '<div class="lg">'+a.map(x=>'<span><i style="background:'+x[1]+'"></i>'+x[0]+'</span>').join("")+'</div>'}
function charts(box){
  if(!items.length){box.innerHTML='<div class="hn">Belum ada data. Grafik muncul setelah kamu mulai mencatat.</div>';return}
  const now=new Date(),ms=[];
  for(let k=5;k>=0;k--){const d=new Date(now.getFullYear(),now.getMonth()-k,1);ms.push({y:d.getFullYear(),m:d.getMonth(),l:d.toLocaleDateString("id-ID",{month:"short"}),in:0,out:0,g:{}})}
  const dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(),days=[];
  for(let d=0;d<dim;d++)days.push({t:0,g:{}});
  items.forEach(it=>{
    const d=new Date(it.ts),m=ms.find(x=>x.y===d.getFullYear()&&x.m===d.getMonth());
    if(!m)return;
    if(it.type==="in"){m.in+=it.amount;return}
    const g=grpOf(it);m.out+=it.amount;m.g[g]=(m.g[g]||0)+it.amount;
    if(m===ms[5]){const x=days[d.getDate()-1];x.t+=it.amount;x.g[g]=(x.g[g]||0)+it.amount}
  });
  const A=ms.map(m=>({l:m.l,segs:[{v:m.in,c:"var(--in)"},{v:m.out,c:"var(--out)"}],cap:m.l+" "+m.y+": masuk "+rp(m.in)+" · keluar "+rp(m.out)+" · selisih "+sg(m.in-m.out)}));
  const B=ms.map(m=>({l:m.l,segs:EXPG.map(g=>({v:m.g[g]||0,c:GC[g]})),cap:m.l+" "+m.y+": "+EXPG.map(g=>g+" "+rp(m.g[g]||0)).join(" · ")}));
  const C=days.map((x,i)=>({l:(i===0||(i+1)%5===0)?String(i+1):"",segs:EXPG.map(g=>({v:x.g[g]||0,c:GC[g]})),cap:"Tanggal "+(i+1)+" "+ms[5].l+": "+rp(x.t)}));
  const tot=ms[5].out,dn=now.getDate(),mxd=days.reduce((b,x,i)=>x.t>days[b].t?i:b,0);
  const cap=(id,arr,i)=>'<div class="hn" id="cap'+id+'">'+arr[i].cap+'</div>';
  box.innerHTML='<div class="hp"><div class="ht">Pemasukan vs pengeluaran</div>'+legend([["Pemasukan","var(--in)"],["Pengeluaran","var(--out)"]])+chartSvg(A,"side",0)+cap(0,A,5)+'<div class="hn">6 bulan terakhir. Ketuk batang untuk melihat angkanya.</div></div>'
   +'<div class="hp"><div class="ht">Pengeluaran per kelompok</div>'+legend(EXPG.map(g=>[g,GC[g]]))+chartSvg(B,"stack",1)+cap(1,B,5)+'</div>'
   +'<div class="hp"><div class="ht">Pengeluaran harian bulan ini</div>'+chartSvg(C,"stack",2)+cap(2,C,dn-1)+'<div class="hn">Total '+rp(tot)+' · rata-rata '+rp(tot/dn)+' per hari'+(days[mxd].t?' · tertinggi tanggal '+(mxd+1)+' ('+rp(days[mxd].t)+')':'')+'</div></div>';
  box.onclick=e=>{const t=e.target;if(t.classList&&t.classList.contains("hit")){const c=[A,B,C][+t.dataset.c],cp=box.querySelector("#cap"+t.dataset.c);if(cp&&c[+t.dataset.i])cp.textContent=c[+t.dataset.i].cap}};
}
function render(){
  const now=new Date(),mi=items.filter(i=>{const d=new Date(i.ts);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()});
  const tin=mi.filter(i=>i.type==="in").reduce((a,b)=>a+b.amount,0),tout=mi.filter(i=>i.type==="out").reduce((a,b)=>a+b.amount,0);
  $("mon").textContent=now.toLocaleDateString("id-ID",{month:"long",year:"numeric"});
  $("sIn").textContent=rp(tin);$("sOut").textContent=rp(tout);
  const bal=tin-tout;$("sBal").textContent=(bal<0?"-":"")+rp(Math.abs(bal));$("sBal").classList.toggle("neg",bal<0);
  // breakdown
  const by={};mi.filter(i=>i.type==="out").forEach(i=>by[i.cat]=(by[i.cat]||0)+i.amount);
  const ents=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  const brk=$("brk");brk.textContent="";health(brk,mi,tin);charts($("chr"));
  if(!ents.length){const p=document.createElement("div");p.className="empty";p.textContent="Belum ada pengeluaran bulan ini.";brk.append(p)}
  ents.forEach(([c,v])=>{
    const r=document.createElement("div");r.className="row";
    const a=document.createElement("span");a.textContent=c;
    const b=document.createElement("div");b.className="bar";const i=document.createElement("i");i.style.width=Math.max(3,v/tout*100)+"%";b.append(i);
    const s=document.createElement("span");s.textContent=rp(v)+" ("+Math.round(v/tout*100)+"%)";
    r.append(a,b,s);brk.append(r);
  });
  // feed
  const feed=$("feed");feed.textContent="";
  if(!items.length){
    const e=document.createElement("div");e.className="empty";
    e.innerHTML='<div class="big">💬</div><b>Catat seperti chat</b><p>Ketik yang kamu beli atau terima, kategorinya diatur otomatis. Ketuk contoh di bawah untuk mencoba.</p>'+["nasi goreng 15.000","grab ke kantor 32rb","gaji 5jt","+ dikasih ibu 200k"].map(x=>'<button type="button" class="ex">'+x+'</button>').join("");
    e.onclick=ev=>{const b=ev.target.closest(".ex");if(b){$("inp").value=b.textContent;$("inp").focus()}};
    feed.append(e);
  }
  let lastDay="";
  items.forEach(it=>{
    const dk=dayKey(it.ts);
    if(dk!==lastDay){const d=document.createElement("div");d.className="day";d.textContent=dayLabel(it.ts);feed.append(d);lastDay=dk}
    const me=document.createElement("div");me.className="me";me.textContent=it.text;feed.append(me);
    const bot=document.createElement("div");bot.className="bot";
    const amt=document.createElement("div");amt.className="amt "+it.type;amt.textContent=(it.type==="in"?"+ ":"− ")+rp(it.amount);
    const ds=document.createElement("div");ds.textContent=it.desc;
    const meta=document.createElement("div");meta.className="meta";
    const tg=document.createElement("button");tg.type="button";tg.className="tag";tg.textContent=it.type==="in"?"Pemasukan":"Pengeluaran";tg.title="Ketuk untuk ganti jenis";
    tg.onclick=()=>{it.type=it.type==="in"?"out":"in";it.cat=it.type==="in"?OTHER_I:OTHER_E;delete it.grp;learn[it.desc.toLowerCase()]={type:it.type,cat:it.cat};save();render()};
    const sel=document.createElement("select");
    const cats=it.type==="in"?[...Object.keys(INCALL),OTHER_I]:Object.values(GROUPS).flat();
    cats.forEach(c=>{const o=document.createElement("option");o.value=c;o.textContent=c;if(c===it.cat)o.selected=true;sel.append(o)});
    sel.onchange=()=>{it.cat=sel.value;delete it.grp;learn[it.desc.toLowerCase()]={type:it.type,cat:it.cat};save();render()};
    const gs=document.createElement("select");gs.className="gsel";gs.title="Kelompok keuangan";
    (it.type==="in"?INGS:EXPG).forEach(c=>{const o=document.createElement("option");o.value=c;o.textContent=c;if(c===grpOf(it))o.selected=true;gs.append(o)});
    gs.onchange=()=>{it.grp=gs.value;learn[it.desc.toLowerCase()]={type:it.type,cat:it.cat,grp:it.grp};save();render()};
    const del=document.createElement("button");del.type="button";del.className="del";del.textContent="✕";del.title="Hapus";
    del.onclick=()=>{items=items.filter(x=>x.id!==it.id);save();render()};
    meta.append(tg,sel,gs,del);
    const ic=document.createElement("div");ic.className="ic "+it.type;ic.textContent=EMO[it.cat]||(it.type==="in"?"💰":"🧾");
    const mid=document.createElement("div");mid.className="mid";ds.className="dsc";
    const tm=document.createElement("small");tm.textContent=new Date(it.ts).toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});mid.append(ds,tm);
    const bt=document.createElement("div");bt.className="btop";bt.append(ic,mid,amt);
    bot.append(bt,meta);feed.append(bot);
  });
  feed.scrollTop=feed.scrollHeight;
}
$("f").onsubmit=e=>{
  e.preventDefault();
  const v=$("inp").value.trim();if(!v)return;
  if(add(v)){$("inp").value="";$("err").textContent="";render()}
  else msg("Nominalnya belum terbaca. Coba tulis seperti: nasi goreng 15000, kopi 20rb, atau gaji 5jt.");
};
let mt;function msg(t,ok){const e=$("err");e.textContent=t;e.style.color=ok?"var(--accent)":"var(--out)";clearTimeout(mt);mt=setTimeout(()=>{e.textContent=""},4500)}
const dl={async save({filename,data}){
  const type=filename.endsWith(".xlsx")?"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet":"text/csv";
  const blob=new Blob([data],{type});
  const file=new File([blob],filename,{type});
  if(navigator.canShare&&navigator.canShare({files:[file]})&&/Android|iPhone|iPad/i.test(navigator.userAgent)){
    try{await navigator.share({files:[file],title:filename});return{status:"saved"}}catch(e){if(e&&e.name==="AbortError")throw{code:"declined"}}
  }
  const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);
  return{status:"saved"};
}};$("exp").style.display="flex";
const p2=n=>String(n).padStart(2,"0");
function today(){const d=new Date();return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
function rows(){return items.slice().sort((a,b)=>a.ts-b.ts).map(i=>{const d=new Date(i.ts);return{Tanggal:d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate()),Keterangan:i.desc,Jenis:i.type==="in"?"Pemasukan":"Pengeluaran",Kategori:i.cat,Kelompok:grpOf(i),Nominal:Math.round(i.amount)}})}
async function doSave(name,data){
  try{const r=await dl.save({filename:name,data});msg(r.status==="saved"?"File tersimpan: "+name:"File dikirim.",true)}
  catch(e){msg(e&&e.code==="declined"?"Penyimpanan dibatalkan.":"Ekspor belum bisa dilakukan di tampilan ini.")}
}
async function expXlsx(){
  if(!items.length)return msg("Belum ada catatan untuk diekspor.");
  if(typeof XLSX==="undefined")return msg("Library Excel gagal dimuat. Coba ekspor CSV.");
  const r=rows(),wb=XLSX.utils.book_new(),ws=XLSX.utils.json_to_sheet(r);
  ws["!cols"]=[{wch:12},{wch:30},{wch:13},{wch:20},{wch:22},{wch:14}];
  XLSX.utils.book_append_sheet(wb,ws,"Transaksi");
  const agg={};r.forEach(x=>{const k=x.Tanggal.slice(0,7)+"|"+x.Jenis+"|"+x.Kelompok+"|"+x.Kategori;agg[k]=(agg[k]||0)+x.Nominal});
  const s=Object.keys(agg).sort().map(k=>{const a=k.split("|");return{Bulan:a[0],Jenis:a[1],Kelompok:a[2],Kategori:a[3],Total:agg[k]}});
  const ws2=XLSX.utils.json_to_sheet(s);ws2["!cols"]=[{wch:10},{wch:13},{wch:22},{wch:20},{wch:14}];
  XLSX.utils.book_append_sheet(wb,ws2,"Ringkasan");
  const buf=XLSX.write(wb,{bookType:"xlsx",type:"array"});
  await doSave("catatan-keuangan-"+today()+".xlsx",new Blob([buf]));
}
function cell(v){v=String(v);return /[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
async function expCsv(){
  if(!items.length)return msg("Belum ada catatan untuk diekspor.");
  const h=["Tanggal","Keterangan","Jenis","Kategori","Kelompok","Nominal"];
  const lines=[h.join(",")].concat(rows().map(x=>h.map(k=>cell(x[k])).join(",")));
  await doSave("catatan-keuangan-"+today()+".csv","\ufeff"+lines.join("\r\n"));
}
$("xX").onclick=expXlsx;$("xC").onclick=expCsv;
function tab(n){["feed","vAn","vCh"].forEach(id=>$(id).classList.toggle("on",id===n));document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===n));$("f").style.display=n==="feed"?"flex":"none";$("err").textContent="";if(n==="feed")$("feed").scrollTop=$("feed").scrollHeight}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>tab(b.dataset.t));
(function(){
  const root=document.documentElement,inp=$("inp"),vv=window.visualViewport,vk=navigator.virtualKeyboard;
  let base=window.innerHeight,focused=false,got=false,timer;
  if(vk){try{vk.overlaysContent=true}catch(e){}}
  const toBottom=()=>{const f=$("feed");if(f.classList.contains("on"))f.scrollTop=f.scrollHeight};
  function apply(p){root.style.setProperty("--kbd",Math.max(0,Math.round(p))+"px");toBottom()}
  function measure(){
    if(!focused)return false;
    let p=null;
    if(window.innerHeight<base-80)p=0;
    else{
      const k=vk&&vk.boundingRect?vk.boundingRect.height:0;
      if(k>40)p=k;
      else if(vv){const d=base-vv.height-vv.offsetTop;if(d>80)p=d}
    }
    if(p===null)return false;
    apply(p);return true;
  }
  inp.addEventListener("focus",()=>{
    focused=true;got=false;root.classList.add("kb");
    let n=0;clearInterval(timer);
    timer=setInterval(()=>{n++;if(measure())got=true;if(n>=8){clearInterval(timer);if(!got)apply(screen.height*0.34)}},70);
  });
  inp.addEventListener("blur",()=>{setTimeout(()=>{
    if(document.activeElement===inp)return;
    focused=false;clearInterval(timer);root.classList.remove("kb");apply(0);
  },120)});
  window.addEventListener("resize",()=>{if(focused)measure();else base=window.innerHeight});
  if(vv)vv.addEventListener("resize",measure);
  if(vk)vk.addEventListener("geometrychange",measure);
  $("send").addEventListener("pointerdown",e=>e.preventDefault());
})();
render();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if("serviceWorker" in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
